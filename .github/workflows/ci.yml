name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meil
          POSTGRES_PASSWORD: meil
          POSTGRES_DB: meil
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.12-alpine
        env:
          CLICKHOUSE_DB: meil
          CLICKHOUSE_USER: meil
          CLICKHOUSE_PASSWORD: meil
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user $CLICKHOUSE_USER --password $CLICKHOUSE_PASSWORD --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://meil:meil@localhost:5432/meil?sslmode=disable
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_DATABASE: meil
      CLICKHOUSE_USER: meil
      CLICKHOUSE_PASSWORD: meil
      MEIL_DB_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"
          cache: true
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Generate sqlc
        run: sqlc generate
      - name: Generated file check
        run: git diff --exit-code
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Vulnerability check
        run: govulncheck ./...
      - name: Migration check
        run: go run ./cmd/meil migrate up
      - name: ClickHouse migration check
        run: go run ./cmd/meil migrate clickhouse up
      - name: Build
        run: CGO_ENABLED=0 go build -o bin/meil ./cmd/meil
      - name: Container build
        run: docker build -f infra/coolify/Dockerfile .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.10"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
