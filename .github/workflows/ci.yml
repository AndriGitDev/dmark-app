name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.924
      - name: Generate templ
        run: templ generate
      - name: Test
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o bin/meil ./cmd/meil
      - name: Templ generate check
        run: git diff --exit-code -- internal/web/views

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.924
      - name: Generate templ
        run: templ generate
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
