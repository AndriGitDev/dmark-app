services:
  serve:
    build:
      context: ../..
      dockerfile: infra/coolify/Dockerfile
    command: ["serve"]
    environment:
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"

  worker:
    build:
      context: ../..
      dockerfile: infra/coolify/Dockerfile
    command: ["worker"]
