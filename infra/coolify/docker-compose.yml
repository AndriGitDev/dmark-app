services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meil
      POSTGRES_USER: meil
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meil -d meil"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/coolify/Dockerfile
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: "https://dmark.kastro.is"
      DATABASE_URL: "postgres://meil:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Coolify}@db:5432/meil?sslmode=disable"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/meil", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
