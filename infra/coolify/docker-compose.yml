services:
  app:
    build:
      context: .
      dockerfile: infra/coolify/Dockerfile
    command: ["serve"]
    environment:
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: "https://meil.kastro.is"
      ASSETS_DIR: "/assets"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/meil", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
