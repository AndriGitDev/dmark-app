services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meil
      POSTGRES_USER: meil
      POSTGRES_PASSWORD: meil
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meil -d meil"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
